name: fix
on:
  push:
    paths: ['.github/workflows/fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix parenthesis
        run: |
          python - <<'PY'
          p = 'map3d.py'
          s = open(p, encoding='utf-8').read()
          bad = "data = json.loads(self.rfile.read(int(self.headers.get('Content-Length', 0)))"
          good = "raw = self.rfile.read(int(self.headers.get('Content-Length', 0)))\n            data = json.loads(raw)"
          if bad not in s:
              raise SystemExit('pattern not found')
          open(p, 'w', encoding='utf-8').write(s.replace(bad, good, 1))
          PY
          git config user.name map3d-bot
          git config user.email bot@users.noreply.github.com
          git add map3d.py
          git commit -m "Fix parenthesis in build handler"
          git push
